<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F6212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AgroSoft Campo</title>
<style>
:root{
  --verde:#4CBB45; --campo:#3F6212; --grano:#B7791F; --tinta:#1F2A1A; --suave:#5C6657;
  --papel:#FAF9F5; --tarjeta:#FFFFFF; --linea:#DDD9CC; --rojo:#B3261E; --rojo-bg:#FDECEA;
  --ok-bg:#E8F5E6; --aviso-bg:#FEF3DC; --radio:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--papel);color:var(--tinta);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:22px 0 8px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--campo);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .tit{flex:1;min-width:0}
.top .tit b{display:block;font-size:17px;line-height:1.1}
.top .tit small{opacity:.85;font-size:12.5px}
.top .atras{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;width:42px;height:42px;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;border:0}
.chip.on{background:var(--verde);color:#0F2A0C}
.chip.off{background:#F2C14E;color:#4A3200}
.chip.pend{background:#fff;color:var(--campo)}

main{padding:14px 16px 40px;max-width:560px;margin:0 auto}

/* Tarjetas / mosaicos */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:var(--radio);
  padding:16px 12px;min-height:104px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;position:relative}
.tile:active{background:var(--ok-bg)}
.tile .ic{font-size:30px;line-height:1}
.tile b{font-size:16px}
.tile small{color:var(--suave);font-size:12.5px}
.badge{position:absolute;top:8px;right:8px;background:var(--rojo);color:#fff;border-radius:999px;
  min-width:22px;height:22px;padding:0 6px;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.badge.v{background:var(--campo)}
.tile.ancho{grid-column:1 / -1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding-right:52px}
.tile.ancho .badge{top:50%;right:14px;transform:translateY(-50%);min-width:28px;height:28px;font-size:14px}

.card{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:var(--radio);padding:14px;margin-bottom:12px}
.aviso{background:var(--aviso-bg);border:1.5px solid #E8C26A;border-radius:var(--radio);padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.aviso.rojo{background:var(--rojo-bg);border-color:#E3A29D}
.aviso.ok{background:var(--ok-bg);border-color:#A9D8A5}
.hint{color:var(--suave);font-size:14px;margin:4px 0 10px}

/* Formularios */
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
label.f small{font-weight:400;color:var(--suave)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea,.pick{
  width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--radio);
  background:#fff;font-size:17px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #B9E4B5;border-color:var(--verde)}
.pick{text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick.vacio{color:var(--suave)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;min-height:50px;border:1.5px solid var(--linea);background:#fff;border-radius:var(--radio);font-weight:600;cursor:pointer}
.seg button.sel{background:var(--campo);border-color:var(--campo);color:#fff}
.seg button.sel.rojo{background:var(--rojo);border-color:var(--rojo)}
.seg button.sel.ambar{background:var(--grano);border-color:var(--grano)}

.btn{display:block;width:100%;min-height:54px;border:0;border-radius:var(--radio);background:var(--campo);color:#fff;
  font-weight:700;font-size:17px;margin-top:18px;cursor:pointer}
.btn:active{filter:brightness(.92)}
.btn.sec{background:#fff;color:var(--campo);border:1.5px solid var(--campo)}
.btn.chico{display:inline-block;width:auto;min-height:44px;padding:0 16px;margin:0;font-size:15px}
.btn[disabled]{opacity:.5}
.err{color:var(--rojo);font-weight:600;margin-top:12px;font-size:15px}

/* Selector de hembra (hoja a pantalla completa) */
.hoja{position:fixed;inset:0;background:var(--papel);z-index:50;display:flex;flex-direction:column}
.hoja header{background:var(--campo);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center}
.hoja header input{flex:1;min-height:46px;border-radius:10px;border:0;padding:0 12px}
.hoja header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;height:46px;padding:0 14px;font-weight:600}
.hoja .lista{flex:1;overflow:auto;padding:8px 12px 30px}
.hoja .filtro{padding:10px 14px;background:#fff;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--linea);
  border-radius:var(--radio);padding:12px 14px;margin:8px 0;width:100%;text-align:left;min-height:62px;cursor:pointer}
.it b{font-size:18px}
.it small{display:block;color:var(--suave);font-size:13.5px}
.est{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.est.servida{background:#E7EEFF;color:#1F3FA0}.est.gestante{background:#FBE6F1;color:#9B1C62}
.est.lactante{background:#FEF3DC;color:#8A5A00}.est.vacia{background:#EEE;color:#444}.est.reemplazo{background:#E8F5E6;color:#256B21}

/* Recelos */
.rec{background:#fff;border:1.5px solid var(--linea);border-radius:var(--radio);padding:12px;margin:10px 0}
.rec .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rec .cab b{font-size:20px}
.rec .dia{font-size:13.5px;color:var(--suave)}
.rec .dia.vent{color:#8A5A00;font-weight:700}
.rec .bt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec .bt button{min-height:56px;border-radius:var(--radio);border:1.5px solid var(--linea);background:#fff;font-weight:700;font-size:16px;cursor:pointer}
.rec .bt button.celo.sel{background:var(--rojo);border-color:var(--rojo);color:#fff}
.rec .bt button.sin.sel{background:var(--campo);border-color:var(--campo);color:#fff}
.rec .nota{font-size:13.5px;margin-top:8px;color:var(--rojo);font-weight:600}
.rec .nota a{color:var(--campo);text-decoration:underline;font-weight:700}
.prog{height:8px;background:#E9E6DA;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--verde)}

/* Listas simples */
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--linea);
  border-radius:var(--radio);padding:12px 14px;margin:8px 0}
.li small{display:block;color:var(--suave);font-size:13.5px}
.li.error{border-color:#E3A29D;background:var(--rojo-bg)}
.li.enviado{opacity:.7}
.mini{border:1.5px solid var(--linea);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;cursor:pointer}
.mini.ok{background:var(--campo);border-color:var(--campo);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:#1F2A1A;color:#fff;padding:13px 18px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.25)}
.login{padding-top:34px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 12px}
.centro{text-align:center}
.pie{margin-top:26px;display:grid;gap:10px}
</style>
</head>
<body>
<div id="raiz"></div>
<script src="../config.js"></script>
<script>
// ============================================================
//  AgroSoft Campo — app móvil (PWA) para la persona de la granja
//  - Funciona sin señal: guarda los registros en el celular y los envía después.
//  - Cada registro lleva una clave única: si se reenvía, el servidor no lo duplica.
// ============================================================
'use strict';

// ---------- Utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const pad = n => String(n).padStart(2, '0');
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const utc = f => { const [y, m, d] = f.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diasDesde = f => f ? Math.floor((utc(hoy()) - utc(f.slice(0, 10))) / 864e5) : null;
const sumaDias = (f, n) => { const t = new Date(utc(f) + n * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const fmt = f => f ? `${f.slice(8, 10)}/${f.slice(5, 7)}` : '—';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const num = v => (v === '' || v == null) ? null : Number(String(v).replace(',', '.'));

const DIAS_GESTACION = 114;
const ESTADO_TXT = { servida:'Servida', gestante:'Gestante', lactante:'Lactante', vacia:'Vacía', reemplazo:'Reemplazo' };

// ---------- Dirección del servidor ----------
let API = (window.AGROSOFT_CONFIG && AGROSOFT_CONFIG.API_URL) || LS.get('ag_api', '') || '';
if (/localhost|127\.0\.0\.1/.test(API) && !/^(localhost|127\.)/.test(location.hostname)) API = 'https://api.agrofranpabel.com';
if (!API) API = 'https://api.agrofranpabel.com';
LS.set('ag_api', API);

// ---------- Estado ----------
const S = {
  token: LS.get('ag_token', null),
  usuario: LS.get('ag_usuario', null),
  datos: LS.get('ag_datos', null),         // copia del servidor (hembras, lotes, bandas…)
  tareas: LS.get('ag_tareas', null),
  tareasHechas: LS.get('ag_tareas_hechas', []),
  cola: LS.get('ag_cola', []),             // registros pendientes / enviados / con error
  vista: 'home', form: null, sheet: null,
  recel: { jornada: new Date().getHours() < 12 ? 'AM' : 'PM', fecha: hoy(), filtro: 'servida' },
  sync: false, necesitaLogin: false, instalar: null, toast: null, loginErr: ''
};
const guardarCola = () => LS.set('ag_cola', S.cola);

// ---------- Red ----------
async function llamar(metodo, ruta, body, clave) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(API + ruta, {
      method: metodo, signal: ctl.signal,
      headers: Object.assign({ 'Content-Type': 'application/json' },
        S.token ? { Authorization: 'Bearer ' + S.token } : {},
        clave ? { 'X-Clave-Cliente': clave } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } finally { clearTimeout(t); }
}

async function traerDatos() {
  const r = await llamar('GET', '/api/campo/datos');
  if (r.status === 401) { S.necesitaLogin = true; throw new Error('401'); }
  if (!r.ok) throw new Error('No se pudieron traer los datos');
  S.datos = Object.assign(r.data, { guardado: Date.now() });
  LS.set('ag_datos', S.datos);
  // Tareas sanitarias: vencidas de los últimos 14 días y las de la próxima semana
  try {
    const t = await llamar('GET', `/api/tareas/calendario?desde=${sumaDias(hoy(), -14)}&hasta=${sumaDias(hoy(), 7)}`);
    if (t.ok) { S.tareas = Object.assign(t.data, { guardado: Date.now() }); LS.set('ag_tareas', S.tareas); }
  } catch {}
  return S.datos;
}

// ---------- Datos con los registros pendientes ya aplicados ----------
// Así la persona ve la hembra "servida" apenas la registra, aunque no haya señal.
function cerdasVista() {
  const base = (S.datos?.cerdas || []).map(c => Object.assign({}, c, { recelos: (c.recelos || []).slice() }));
  const porId = new Map(base.map(c => [c.id, c]));
  const guardado = S.datos?.guardado || 0;
  for (const op of S.cola) {
    if (op.estado === 'error') continue;
    if (op.estado === 'enviado' && !(op.enviado_en > guardado)) continue;
    const b = op.body || {};
    if (op.tipo === 'reemplazo') {          // hembra nueva aún sin enviar: aparece ya en la lista
      const rz = (S.datos?.razas || []).find(r => r.id === b.raza_id);
      porId.set(op.temp_id, { id: op.temp_id, arete: b.arete, estado: 'reemplazo', ciclo_actual: 0, raza: rz?.nombre || '', recelos: [],
        fecha_ultimo_servicio: null, fecha_ultimo_parto: null, fecha_ultimo_destete: null, mort_lactancia: 0, ultimo_peso: b.peso_ingreso ? { fecha: b.fecha_ingreso, peso: b.peso_ingreso } : null });
      continue;
    }
    const c = porId.get(b.cerda_id);
    if (!c) continue;
    if (op.tipo === 'servicio') { c.estado = 'servida'; c.fecha_ultimo_servicio = b.fecha_servicio; c.recelos = []; }
    else if (op.tipo === 'diagnostico') { if (b.resultado === 'positivo') c.estado = 'gestante'; else if (b.resultado === 'negativo') c.estado = 'vacia'; }
    else if (op.tipo === 'parto') { c.estado = 'lactante'; c.fecha_ultimo_parto = b.fecha_parto; c.ultimo_parto_vivos = b.nacidos_vivos; c.ultimo_parto_id = null; c.mort_lactancia = 0; }
    else if (op.tipo === 'mortalidad') { c.mort_lactancia = (c.mort_lactancia || 0) + b.cantidad; }
    else if (op.tipo === 'destete') { c.estado = 'vacia'; c.fecha_ultimo_destete = b.fecha_destete; }
    else if (op.tipo === 'salida') { porId.delete(c.id); }
    else if (op.tipo === 'recelo') {
      c.recelos = c.recelos.filter(x => !(x.fecha === b.fecha && x.jornada === b.jornada));
      c.recelos.push({ fecha: b.fecha, jornada: b.jornada, resultado: b.resultado });
    }
  }
  return [...porId.values()].sort((a, b) => a.arete.localeCompare(b.arete, 'es', { numeric: true }));
}
const cerdaPorId = id => cerdasVista().find(c => c.id === id);

const vivosActuales = c => c.ultimo_parto_vivos == null ? null : Math.max(0, c.ultimo_parto_vivos - (c.mort_lactancia || 0));
function infoCerda(c) {
  if (c.estado === 'servida') { const d = diasDesde(c.fecha_ultimo_servicio); return `Servida hace ${d} d (${fmt(c.fecha_ultimo_servicio)})`; }
  if (c.estado === 'gestante') { const d = diasDesde(c.fecha_ultimo_servicio); return `Día ${d} de ${DIAS_GESTACION} · parto ~${fmt(sumaDias(c.fecha_ultimo_servicio, DIAS_GESTACION))}`; }
  if (c.estado === 'lactante') { const d = diasDesde(c.fecha_ultimo_parto); return `Parto hace ${d} d · ${vivosActuales(c) ?? '?'} lechones vivos`; }
  if (c.estado === 'vacia') { return c.fecha_ultimo_destete ? `Vacía · destete hace ${diasDesde(c.fecha_ultimo_destete)} d` : 'Vacía'; }
  return ESTADO_TXT[c.estado] || c.estado;
}

// ---------- Pendientes del día (calculados con las fechas) ----------
function calcularAlertas() {
  const out = [];
  for (const c of cerdasVista()) {
    if (c.estado === 'servida' && c.fecha_ultimo_servicio) {
      const d = diasDesde(c.fecha_ultimo_servicio);
      if (d >= 28) out.push({ k: 'eco', c, d, txt: `Confirmar preñez (día ${d})`, accion: 'diagnostico', pr: 2 });
      else if (d >= 17) out.push({ k: 'recelo', c, d, txt: `Revisar recelo AM/PM (día ${d})`, accion: 'recelos', pr: 1 });
    } else if (c.estado === 'gestante' && c.fecha_ultimo_servicio) {
      const d = diasDesde(c.fecha_ultimo_servicio);
      if (d >= 108) out.push({ k: 'parto', c, d, txt: `Próxima a parir (día ${d} de ${DIAS_GESTACION})`, accion: 'parto', pr: 0 });
    } else if (c.estado === 'lactante' && c.fecha_ultimo_parto) {
      const d = diasDesde(c.fecha_ultimo_parto);
      if (d >= 21) out.push({ k: 'destete', c, d, txt: `Lista para destetar (${d} días de lactancia)`, accion: 'destete', pr: 3 });
    } else if (c.estado === 'vacia' && c.fecha_ultimo_destete) {
      const d = diasDesde(c.fecha_ultimo_destete);
      if (d >= 3 && d <= 10) out.push({ k: 'celo', c, d, txt: `Vigilar celo (destetada hace ${d} d)`, accion: 'recelos_vacia', pr: 4 });
    }
  }
  return out.sort((a, b) => a.pr - b.pr || b.d - a.d);
}

function tareasPendientes() {
  const hechas = new Set(S.tareasHechas);
  for (const op of S.cola) if (op.tipo === 'tarea' && op.estado !== 'error') hechas.add(op.clave_tarea);
  return (S.tareas?.eventos || []).filter(e => !hechas.has(`${e.tarea_id}-${e.cerda_id}-${e.fecha}`));
}

// ---------- Definición de formularios ----------
const hoyMax = () => hoy();
const FORMS = {
  servicio: {
    titulo: 'Servicio', icono: '💉', ayuda: 'Hembras vacías o de reemplazo. También sirve para repetir una monta o inseminación.',
    campos: [
      { k: 'cerda_id', t: 'cerda', label: 'Hembra', filtro: ['vacia', 'reemplazo', 'servida'] },
      { k: 'fecha', t: 'fecha', label: 'Fecha del servicio' },
      { k: 'tipo', t: 'seg', label: 'Tipo', opts: [['IA', 'Inseminación'], ['Monta', 'Monta']], def: 'IA' },
      { k: 'verraco', t: 'texto', label: 'Verraco / pajilla', opc: true },
      { k: 'dosis', t: 'texto', label: 'Dosis', opc: true },
      { k: 'obs', t: 'area', label: 'Observaciones', opc: true }
    ],
    armar: (v, u) => ({ ruta: '/api/cria/servicios',
      body: { cerda_id: v.cerda_id, fecha_servicio: v.fecha, tipo: v.tipo, verraco: v.verraco || null, dosis: v.dosis || null, operario: u?.nombre || null, observaciones: v.obs || null },
      resumen: c => `Servicio · ${c.arete} · ${fmt(v.fecha)}` })
  },
  diagnostico: {
    titulo: 'Diagnóstico de preñez', icono: '🩺', ayuda: 'Positivo la pasa a gestante. Negativo la devuelve a vacía para un nuevo servicio.',
    campos: [
      { k: 'cerda_id', t: 'cerda', label: 'Hembra', filtro: ['servida', 'gestante'] },
      { k: 'fecha', t: 'fecha', label: 'Fecha' },
      { k: 'resultado', t: 'seg', label: 'Resultado', def: 'positivo', opts: [['positivo', 'Preñada', 'ok'], ['negativo', 'Vacía', 'rojo'], ['dudoso', 'Dudoso', 'ambar']] },
      { k: 'metodo', t: 'seg', label: 'Método', def: 'ecografia', opts: [['ecografia', 'Ecografía'], ['retorno_celo', 'Retorno a celo'], ['otro', 'Otro']] },
      { k: 'obs', t: 'area', label: 'Observaciones', opc: true }
    ],
    armar: (v, u, c) => ({ ruta: '/api/cria/diagnosticos',
      body: { cerda_id: v.cerda_id, servicio_id: c?.ultimo_servicio_id || null, fecha: v.fecha, resultado: v.resultado, metodo: v.metodo, observaciones: v.obs || null },
      resumen: c => `Diagnóstico ${v.resultado} · ${c.arete}` })
  },
  parto: {
    titulo: 'Parto', icono: '🐖', ayuda: 'La hembra pasa a lactante.',
    campos: [

// Inventario de alimento: lo que dice el servidor + lo que este celular tiene pendiente de enviar
function invMapa() {
  const A = S.datos?.alimento, m = { planta: {}, g: {} };
  const add = (o, k, n) => { o[k] = (o[k] || 0) + n; };
  for (const p of A?.planta || []) m.planta[p.referencia_id] = p.inventario;
  for (const g of A?.granjas || []) for (const it of g.items) m.g[g.id + '|' + it.referencia_id] = it.inventario;
  const guardado = S.datos?.guardado || 0;
  for (const op of S.cola) {
    if (op.estado === 'error') continue;
    if (op.estado === 'enviado' && !(op.enviado_en > guardado)) continue;
    const b = op.body || {}, n = b.bultos || 0;
    if (op.tipo === 'alim_cria') { const g = granjaCria(); if (g) add(m.g, g.id + '|' + b.referencia_id, -n); }
    else if (op.tipo === 'alim_ceba') { const g = (S.datos?.granjas_alimento || []).find(x => x.granja_ceba_id === b.granja_id); if (g) add(m.g, g.id + '|' + b.referencia_id, -n); }
    else if (op.tipo === 'planta_prod') add(m.planta, b.referencia_id, n);
    else if (op.tipo === 'planta_desp') { add(m.planta, b.referencia_id, -n); if (b.destino === 'granja') add(m.g, b.granja_id + '|' + b.referencia_id, n); }
  }
  return m;
}
// Filas para la pantalla de inventario (con días restantes según el promedio de la última semana)
function invFilas() {
  const m = invMapa(), A = S.datos?.alimento, out = [];
  for (const g of S.datos?.granjas_alimento || []) {
    const filas = [];
    for (const r of S.datos?.referencias || []) {
      const k = g.id + '|' + r.id;
      if (!(k in m.g)) continue;
      const it = (A?.granjas || []).find(x => x.id === g.id)?.items.find(x => x.referencia_id === r.id);
      const prom = it?.prom_dia || 0, inv = Math.round(m.g[k] * 100) / 100;
      const dias = prom > 0 ? Math.max(0, inv / prom) : null;
      const estado = prom <= 0 ? 'sin' : inv <= 0 ? 'agotado' : dias < 3 ? 'alerta' : dias < 6 ? 'atencion' : 'ok';
      filas.push({ ref: r.nombre, inv, prom, dias, estado });
    }
    out.push({ nombre: g.nombre, filas });
  }
  return out;
}
const nAlertasAlim = () => invFilas().reduce((n, g) => n + g.filas.filter(f => f.estado === 'alerta' || f.estado === 'agotado').length, 0);

function hintInv() {
  if (!S.form) return '';
  const { tipo, vals: v } = S.form, m = invMapa(), n = num(v.bultos) || 0;
  const linea = (txt, mal) => `<p class="hint" style="${mal ? 'color:var(--rojo);font-weight:600' : ''}">${txt}</p>`;
  if (!v.referencia) return '';
  const rn = refNom(v.referencia);
  if (tipo === 'alim_cria' || tipo === 'alim_ceba') {
    const g = tipo === 'alim_cria' ? granjaCria() : (S.datos?.granjas_alimento || []).find(x => x.granja_ceba_id === loteDe(v.lote)?.granja_ceba_id);
    if (!g) return '';
    const inv = m.g[g.id + '|' + v.referencia] || 0;
    return linea(`Inventario de ${esc(rn)} en ${esc(g.nombre)}: <b>${inv}</b> bultos.`, false) +
      (n > inv ? linea(`Con ${n} bultos el inventario quedaría en negativo (${Math.round((inv - n) * 100) / 100}). Verifica que la referencia sea la correcta; igual puedes guardar.`, true) : '');
  }
  if (tipo === 'planta_prod') return linea(`En la planta hay <b>${m.planta[v.referencia] || 0}</b> bultos de ${esc(rn)}.`, false);
  if (tipo === 'planta_desp') {
    const inv = m.planta[v.referencia] || 0;
    return linea(`En la planta hay <b>${inv}</b> bultos de ${esc(rn)}.`, false) +
      (n > inv ? linea(`Estás despachando más de lo que hay registrado en la planta (${n} > ${inv}). Revisa la producción registrada; igual puedes guardar.`, true) : '');
  }
  return '';
}

// ---------- Cola de envío ----------
function encolar(op) {
  op.id = uuid(); op.estado = 'pendiente'; op.creado = Date.now();
  S.cola.push(op); guardarCola();
  sincronizar();
}
async function sincronizar() {
  if (S.sync || !S.token) return;
  const hay = () => S.cola.some(o => o.estado === 'pendiente');
  if (!hay() && Date.now() - (S.datos?.guardado || 0) < 5 * 60e3) return;
  S.sync = true; pintarEstado();
  try {
    for (const op of S.cola.filter(o => o.estado === 'pendiente')) {
      // El destete necesita el id real del parto; si el parto se registró sin señal, se busca ahora.
      if (op.resolverParto && !op.body.parto_id) {
        const d = await traerDatos();
        const c = d.cerdas.find(x => x.id === op.body.cerda_id);
        if (!c || !c.ultimo_parto_id) { op.estado = 'error'; op.error = 'No se encontró el parto de esta hembra en el servidor.'; guardarCola(); continue; }
        op.body.parto_id = c.ultimo_parto_id;
      }
      // Hembra registrada sin señal en este mismo celular: se busca su id real en el servidor
      if (op.arete_ref && op.body.cerda_id < 0) {
        const d = await traerDatos();
        const c = d.cerdas.find(x => x.arete === op.arete_ref);
        if (!c) { op.estado = 'error'; op.error = 'La hembra ' + op.arete_ref + ' aún no existe en el servidor.'; guardarCola(); continue; }
        op.body.cerda_id = c.id;
      }
      const r = await llamar('POST', op.ruta, op.body, op.id);
      if (r.status === 401) { S.necesitaLogin = true; break; }
      if (r.ok) { op.estado = 'enviado'; op.enviado_en = Date.now(); delete op.error; }
      else if (r.status >= 500 || r.status === 409 || r.status === 429) { op.error = (r.data && r.data.error) || 'El servidor no respondió, se reintentará.'; guardarCola(); break; }
      else { op.estado = 'error'; op.error = (r.data && r.data.error) || ('Error ' + r.status); }
      guardarCola();
    }
    // Quitar enviados con más de 3 días
    S.cola = S.cola.filter(o => !(o.estado === 'enviado' && Date.now() - o.enviado_en > 3 * 864e5));
    guardarCola();
    if (!S.necesitaLogin) await traerDatos();
  } catch (e) { /* sin señal: queda pendiente */ }
  S.sync = false; render();
}
setInterval(() => { if (S.token && navigator.onLine) sincronizar(); }, 60000);
addEventListener('online', () => { pintarEstado(); sincronizar(); });

function chipEstado(pend) {
  pend = pend ?? S.cola.filter(o => o.estado !== 'enviado').length;

function validar(tipo, v) {
  const f = FORMS[tipo];
  if (!v.fecha) return 'Falta la fecha.';
  if (v.fecha > hoy()) return 'La fecha no puede ser futura.';
  if (diasDesde(v.fecha) > 60) return 'La fecha es de hace más de 60 días. Revísala.';
  for (const c of visibles(f, v)) {
    if (c.t === 'cerda' && !v.cerda_id) return 'Elige la hembra.';
    if (c.t === 'lote' && !v.lote) return 'Elige el lote.';
    if (c.t === 'ref' && !v.referencia) return 'Elige la referencia de alimento.';
    if (c.t === 'granjaal' && !v.granja_al) return 'Elige la granja de destino.';
  }
  if (tipo === 'mortalidad') {
    const c = cerdaPorId(v.cerda_id), n = num(v.cantidad), vivos = c ? vivosActuales(c) : null;
    if (n == null || n < 1 || !Number.isInteger(n)) return 'Escribe cuántos lechones murieron.';
    if (vivos != null && n > vivos) return `La camada solo tiene ${vivos} lechones vivos.`;
    if (c?.fecha_ultimo_parto && v.fecha < c.fecha_ultimo_parto) return 'La fecha no puede ser anterior al parto.';
  }
  if (tipo === 'reemplazo') {
    const a = String(v.arete || '').trim();
    if (!a) return 'Escribe el arete de la hembra.';
    if (!v.raza) return 'Elige la raza.';
    if (cerdasVista().some(c => c.arete.toLowerCase() === a.toLowerCase())) return 'Ya existe una hembra con ese arete.';
    const p = num(v.peso); if (p != null && (p <= 0 || p >= 400)) return 'El peso de ingreso parece incorrecto.';
    if (v.nacimiento && v.nacimiento > v.fecha) return 'La fecha de nacimiento no puede ser después del ingreso.';
  }
  if (tipo === 'pesaje') {
    if (v.tipo === 'hembra') { const p = num(v.peso); if (p == null || p < 5 || p > 400) return 'Escribe el peso de la hembra (5 a 400 kg).'; }
    else {
      const n = num(v.cantidad), t = num(v.peso_total);
      if (n == null || n < 1 || !Number.isInteger(n)) return 'Escribe cuántos animales pesaste.';
      if (t == null || t <= 0) return 'Escribe el peso total.';
      if (t / n < 3 || t / n > 200) return `El promedio (${(t / n).toFixed(1)} kg por animal) parece incorrecto. Revisa el peso total y la cantidad.`;
    }
  }
  if (tipo === 'parto') {
    const vivos = num(v.vivos); if (vivos == null || vivos < 0 || vivos > 30) return 'Escribe los lechones vivos (0 a 30).';
    for (const k of ['muertos', 'momif']) { const n = num(v[k]) ?? 0; if (n < 0 || n > 30) return 'Revisa muertos y momificados.'; }
    const p = num(v.peso); if (p != null && (p <= 0 || p > 60)) return 'El peso de la camada parece incorrecto.';
  }
  if (tipo === 'destete') {
    const n = num(v.lechones); if (n == null || n < 0 || n > 25) return 'Escribe los lechones destetados (0 a 25).';
    const p = num(v.peso); if (p != null && (p <= 0 || p > 400)) return 'El peso de la camada parece incorrecto.';
  }
  if (tipo === 'alim_cria' || tipo === 'alim_ceba' || tipo === 'planta_prod' || tipo === 'planta_desp') {
    const b = num(v.bultos); if (b == null || b <= 0 || b > (tipo.startsWith('planta') ? 5000 : 2000)) return 'Escribe los bultos (mayor que 0).';
  }
  if (tipo === 'muerte_ceba') {
    const n = num(v.cantidad), l = loteDe(v.lote);
    if (n == null || n < 1) return 'Escribe cuántos animales murieron.';
    if (l && n > l.inventario) return `El lote solo tiene ${l.inventario} animales.`;
  }
  // No registrar dos veces el mismo parto o destete pendiente
  if ((tipo === 'parto' || tipo === 'destete') && S.cola.some(o => o.tipo === tipo && o.estado === 'pendiente' && o.body.cerda_id === v.cerda_id))
    return 'Ya hay un registro igual de esta hembra esperando envío.';
  return '';
}

function guardarForm() {
  const { tipo, vals } = S.form, f = FORMS[tipo];
  const e = validar(tipo, vals);
  if (e) { S.form.err = e; $('#fErr').textContent = e; return; }
  const c = vals.cerda_id ? cerdaPorId(vals.cerda_id) : null;
  const a = f.armar(vals, S.usuario, c);
  encolar({ tipo, ruta: a.ruta, body: a.body, resolverParto: !!a.resolverParto, resumen: a.resumen(c),
    temp_id: a.temp_id, arete_ref: (c && c.id < 0) ? c.arete : undefined });
  toast('✓ Guardado: ' + a.resumen(c));
  // Se queda en el mismo formulario para registrar otro; limpia lo que cambia de un registro a otro
  for (const k of ['cerda_id', 'vivos', 'lechones', 'peso', 'peso_total', 'bultos', 'cantidad', 'verraco', 'dosis', 'obs', 'arete']) delete vals[k];
  if (tipo === 'mortalidad') vals.causa = 'Aplastados';
  if (tipo === 'parto') { vals.vivos = ''; vals.muertos = '0'; vals.momif = '0'; }
  S.form.err = '';
  render();
}

function marcarRecelo(id, resultado) {
  const R = S.recel, c = cerdaPorId(id);
  // Un solo registro pendiente por hembra/fecha/jornada: el último gana
  S.cola = S.cola.filter(o => !(o.tipo === 'recelo' && o.estado === 'pendiente' && o.body.cerda_id === id && o.body.fecha === R.fecha && o.body.jornada === R.jornada));
  const ya = (c.recelos || []).find(x => x.fecha === R.fecha && x.jornada === R.jornada);
  if (ya && ya.resultado === resultado && !S.cola.some(o => o.tipo === 'recelo' && o.body.cerda_id === id && o.body.fecha === R.fecha && o.body.jornada === R.jornada)) {
    // ya está registrado igual en el servidor; no se vuelve a enviar
    render(); return;
  }
  encolar({ tipo: 'recelo', ruta: '/api/campo/recelos', body: { cerda_id: id, fecha: R.fecha, jornada: R.jornada, resultado },
    resumen: `Recelo ${R.jornada} · ${c.arete} · ${resultado === 'en_celo' ? 'en celo' : 'sin celo'}` });
  render();
}

// ----- Pendientes del día -----
function vAlertas() {
  const al = calcularAlertas();
  const grupos = [['parto', 'Próximas a parir'], ['recelo', 'Revisar recelo'], ['eco', 'Confirmar preñez'], ['destete', 'Para destetar'], ['celo', 'Vigilar celo']];
  const html = grupos.map(([k, tit]) => {
    const xs = al.filter(a => a.k === k); if (!xs.length) return '';
    return `<h2>${tit} (${xs.length})</h2>` + xs.map(a => `<button class="it" data-act="alerta" data-id="${a.c.id}" data-a="${a.accion}">
      <span><b>${esc(a.c.arete)}</b><small>${esc(a.txt)}</small></span><span>›</span></button>`).join('');
  }).join('');
  return `${barra('Pendientes de hoy', 'Calculado con las fechas', true)}<main>
    ${html || `<div class="aviso ok">No hay hembras por atender con las fechas actuales.</div>`}
    <p class="hint" style="margin-top:18px">Recelo desde el día 17 del servicio, preñez desde el día 28, parto desde el día 108, destete desde los 21 días de lactancia.</p></main>`;
}

// ----- Tareas sanitarias -----
function vTareas() {
  const xs = tareasPendientes(), h = hoy();
  const porFecha = {}; xs.forEach(e => (porFecha[e.fecha] = porFecha[e.fecha] || []).push(e));
  const html = Object.keys(porFecha).sort().map(f => {
    const rot = f < h ? 'Vencidas · ' + fmt(f) : f === h ? 'Hoy' : fmt(f);
    return `<h2>${rot}</h2>` + porFecha[f].map(e => `<div class="li"><span><b>${esc(e.tarea)}</b><small>${esc(e.animal)} · ${esc(e.tipo_tarea || '')}${e.cantidad ? ' · ' + esc(e.cantidad) : ''}</small></span>
      <button class="mini ok" data-act="tarea" data-t="${e.tarea_id}" data-c="${e.cerda_id}" data-f="${e.fecha}">Hecha</button></div>`).join('');
  }).join('');
  return `${barra('Tareas', 'Vacunas y manejo sanitario', true)}<main>
    ${!S.tareas ? `<div class="aviso">Aún no se han descargado las tareas. Conéctate y toca “Actualizar datos”.</div>` : ''}
    ${html || (S.tareas ? `<div class="aviso ok">No hay tareas pendientes en este período.</div>` : '')}
    <p class="hint">Muestra las vencidas de los últimos 14 días y las de la próxima semana.</p></main>`;
}

// ----- Envíos -----
function vInventario() {
  const gs = invFilas(), m = invMapa();
  const col = { alerta: 'var(--rojo)', agotado: 'var(--rojo)', atencion: '#B7791F', ok: 'var(--campo)', sin: 'var(--suave)' };
  const txt = f => f.estado === 'sin' ? 'sin consumo reciente' : f.estado === 'agotado' ? 'AGOTADO' : `${f.dias.toFixed(1)} días`;
  const n = nAlertasAlim();
  return `${barra('Inventario de alimento', 'Bultos de 40 kg', true)}<main>
    ${n ? `<div class="aviso rojo"><b>${n} referencia(s) con menos de 3 días de alimento.</b> Avisa a la planta para despachar.</div>` : `<div class="aviso ok">No hay alertas: todas las referencias tienen más de 3 días.</div>`}
    ${gs.map(g => `<h2>${esc(g.nombre)}</h2>${g.filas.length ? g.filas.map(f => `<div class="li"><span><b>${esc(f.ref)}</b>
      <small>Gasto promedio última semana: ${f.prom.toFixed(1)} bultos/día</small></span>
      <span style="text-align:right"><b style="font-size:20px">${f.inv}</b><small style="display:block;color:${col[f.estado]};font-weight:700">${txt(f)}</small></span></div>`).join('') : '<p class="hint">Aún no hay inventario cargado.</p>'}`).join('')}
    ${S.usuario?.rol !== 'operador' ? `<h2>Planta</h2>${(S.datos?.referencias || []).filter(r => r.id in m.planta).map(r => `<div class="li"><span><b>${esc(r.nombre)}</b><small>Producido − despachado</small></span><span style="text-align:right"><b style="font-size:20px">${Math.round(m.planta[r.id] * 100) / 100}</b></span></div>`).join('') || '<p class="hint">Aún no hay producción registrada.</p>'}` : ''}
  </main>`;
}

function vEnvios() {
  const xs = S.cola.slice().sort((a, b) => b.creado - a.creado);
  const hora = t => new Date(t).toLocaleString('es-CO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const pend = xs.filter(o => o.estado === 'pendiente').length;
  return `${barra('Envíos', 'Registros de este celular', true)}<main>
    ${pend ? `<div class="aviso">${pend} registro(s) esperan señal para enviarse. No se pierden aunque cierres la app.</div>` : `<div class="aviso ok">Todo está enviado.</div>`}
    <button class="btn" data-act="sync" style="margin:0 0 8px" ${S.sync ? 'disabled' : ''}>${S.sync ? 'Enviando…' : 'Enviar ahora'}</button>
    ${xs.map(o => `<div class="li ${o.estado}"><span><b>${esc(o.resumen)}</b>
      <small>${hora(o.creado)} · ${o.estado === 'enviado' ? 'Enviado ✓' : o.estado === 'error' ? 'No se pudo registrar' : 'Por enviar'}</small>
      ${o.estado === 'error' ? `<small style="color:var(--rojo);font-weight:600">${esc(o.error)}</small>` : ''}</span>
      ${o.estado === 'error' ? `<button class="mini" data-act="descartar" data-id="${o.id}">Descartar</button>` : ''}</div>`).join('') || `<p class="hint centro">Aún no hay registros.</p>`}
  </main>`;
}

// ---------- Render y eventos ----------
function render() {
  const raiz = $('#raiz');
  if (!S.token || (S.necesitaLogin && S.vista === 'login')) { raiz.innerHTML = vLogin(); return enlazarLogin(); }
  const v = { home: vHome, form: vForm, recelos: vRecelos, alertas: vAlertas, tareas: vTareas, envios: vEnvios, inventario: vInventario }[S.vista] || vHome;
  const y = scrollY;
  raiz.innerHTML = v() + (S.sheet ? hojaCerdas() : '');
  if (S.vista !== 'home') scrollTo(0, y);
  if (S.sheet) { const q = $('#qCerda'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
function enlazarLogin() {
  $('#fLogin').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#lEmail').value.trim(), pass = $('#lPass').value;
    const btn = $('#fLogin button'); btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const r = await fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'No se pudo entrar');
      S.token = d.token; S.usuario = d.usuario; S.necesitaLogin = false; S.loginErr = '';
      LS.set('ag_token', S.token); LS.set('ag_usuario', S.usuario); LS.set('ag_email', email);
      S.vista = 'home'; render();
      try { await traerDatos(); } catch {}
      render(); sincronizar();
    } catch (err) {
      S.loginErr = err.name === 'TypeError' ? 'Sin conexión. Necesitas señal para iniciar sesión.' : err.message;
      btn.disabled = false; btn.textContent = 'Entrar'; $('#lErr').textContent = S.loginErr;
    }
  });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-seg]');
  if (!el) return;
  if (el.dataset.seg) { S.form.vals[el.dataset.seg] = el.dataset.val; return render(); }
  const act = el.dataset.act; if (act !== undefined) e.preventDefault();
  if (act.startsWith('form:')) return abrirForm(act.slice(5));
  switch (act) {
    case 'atras': history.back(); break;
    case 'recelos': ir('recelos'); break;
    case 'alertas': ir('alertas'); break;
    case 'tareas': ir('tareas'); break;
    case 'envios': ir('envios'); break;
    case 'inventario': ir('inventario'); break;
    case 'sync': sincronizar(); break;
    case 'refrescar':
      toast('Actualizando…');
      try { await traerDatos(); toast('✓ Datos actualizados'); } catch { toast(S.necesitaLogin ? 'Inicia sesión otra vez' : 'Sin señal: se conservan los datos anteriores'); }
      render(); break;
    case 'salir':
      if (S.cola.some(o => o.estado === 'pendiente') && !confirm('Hay registros sin enviar en este celular. Se enviarán cuando vuelvas a iniciar sesión. ¿Cerrar sesión?')) break;
      S.token = null; S.usuario = null; LS.del('ag_token'); LS.del('ag_usuario'); S.vista = 'home'; render(); break;
    case 'relogin': S.vista = 'login'; render(); break;
    case 'instalar': if (S.instalar) { S.instalar.prompt(); S.instalar = null; } break;
    case 'elegir-cerda': S.sheet = { q: '', todas: false }; render(); break;
    case 'cerrar-hoja': S.sheet = null; render(); break;
    case 'todas': S.sheet.todas = !S.sheet.todas; render(); break;
    case 'pick': S.form.vals.cerda_id = Number(el.dataset.id); S.sheet = null; aplicarDefectos(); render(); break;
    case 'jornada': S.recel.jornada = el.dataset.j; render(); break;
    case 'rfiltro': S.recel.filtro = el.dataset.f; render(); break;
    case 'rec': marcarRecelo(Number(el.dataset.id), el.dataset.r); break;
    case 'servir': abrirForm('servicio', { cerda_id: Number(el.dataset.id) }); break;
    case 'alerta': {
      const id = Number(el.dataset.id), a = el.dataset.a;
      if (a === 'recelos') { S.recel.filtro = 'servida'; ir('recelos'); }
      else if (a === 'recelos_vacia') { S.recel.filtro = 'vacia'; ir('recelos'); }
      else abrirForm(a, { cerda_id: id });
      break;
    }
    case 'tarea': {
      const t = Number(el.dataset.t), c = el.dataset.c ? Number(el.dataset.c) : null, f = el.dataset.f;
      const ev = (S.tareas?.eventos || []).find(x => x.tarea_id === t && x.cerda_id === c && x.fecha === f);
      encolar({ tipo: 'tarea', clave_tarea: `${t}-${c}-${f}`, ruta: '/api/tareas/aplicar',
        body: { tarea_id: t, cerda_id: c, fecha_programada: f, fecha_aplicada: hoy(), operario: S.usuario?.nombre || null },
        resumen: `Tarea hecha · ${ev?.tarea || ''} · ${ev?.animal || ''}` });
      toast('✓ Tarea registrada'); render(); break;
    }
    case 'descartar': S.cola = S.cola.filter(o => o.id !== el.dataset.id); guardarCola(); render(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'qCerda') {
    S.sheet.q = t.value;
    const f = FORMS[S.form.tipo].campos.find(c => c.t === 'cerda');
    let l = cerdasVista(); if (f.filtro && !S.sheet.todas) l = l.filter(c => f.filtro.includes(c.estado));
    const total = l.length; if (t.value) l = l.filter(c => c.arete.toLowerCase().includes(t.value.toLowerCase()));
    $('#lstCerda').innerHTML = listaCerdasHtml(l, total); return;
  }
  if (t.dataset.k && S.form) S.form.vals[t.dataset.k] = t.value;
  if (S.form && t.dataset.k === 'bultos') { const h = $('#invHint'); if (h) h.innerHTML = hintInv(); }
  if (S.form?.tipo === 'pesaje' && (t.dataset.k === 'cantidad' || t.dataset.k === 'peso_total')) {
    const n = num(S.form.vals.cantidad), tt = num(S.form.vals.peso_total), el = $('#promLote');
    if (el) el.textContent = (n > 0 && tt > 0) ? `Promedio: ${(tt / n).toFixed(1)} kg por animal` : '';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'recFecha') { S.recel.fecha = t.value || hoy(); render(); }
  else if (t.tagName === 'SELECT' && t.dataset.k && S.form) {
    S.form.vals[t.dataset.k] = t.value;
    if (t.dataset.k === 'referencia' && S.form.tipo === 'alim_cria') {
      const f = FASE_DE_REF[refNom(t.value).toLowerCase()]; if (f) S.form.vals.fase = f;
    }
    render();
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'fReg') { e.preventDefault(); guardarForm(); } });

// ---------- Instalación y arranque ----------
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.instalar = e; if (S.vista === 'home' || !S.token) render(); });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
history.replaceState({ vista: 'home' }, '');
render();
if (S.token && navigator.onLine) sincronizar();
</script>
</body>
</html>
